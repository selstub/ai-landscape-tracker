name: Update AI Landscape Data

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-news.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --staged --quiet || git commit -m "[bot] Update latest news data"
          git push

  update-logos:
    runs-on: ubuntu-latest
    # Run monthly on the 1st at 6:00 AM UTC
    if: github.event.schedule == '0 6 * * *' && github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check if first of month
        id: date-check
        run: |
          if [ "$(date +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.date-check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.date-check.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run logo update script
        if: steps.date-check.outputs.run == 'true'
        run: node scripts/update-logos.js

      - name: Commit and push if changed
        if: steps.date-check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logos/
          git diff --staged --quiet || git commit -m "[bot] Update company logos"
          git push
